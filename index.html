<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBH-WW1 — Three.js</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%235c6b4a'/><text x='2' y='12' font-size='10' fill='%23c9b48a'>T</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
  #app { width: 100%; height: 100%; }
  canvas { display: block; }

  /* ---------- Loading ---------- */
  #loader {
    position: fixed; inset: 0; background: #1a1a1a; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #ddd; transition: opacity .6s;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #loader h1 { font-size: 42px; letter-spacing: 6px; margin-bottom: 8px; color: #c9b48a; }
  #loader h1 span { color: #7a8a6a; }
  #loader p { color: #888; margin-bottom: 30px; letter-spacing: 2px; }
  #bar { width: 320px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
  #barFill { height: 100%; width: 0%; background: linear-gradient(90deg, #7a8a6a, #c9b48a); transition: width .2s; }
  #loadText { margin-top: 10px; font-size: 13px; color: #999; }

  /* ---------- Crosshair ---------- */
  #crosshair {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    pointer-events: none; z-index: 10;
    transition: opacity .2s;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,.85);
  }
  #crosshair::before { width: 2px; height: 18px; left: -1px; top: -9px; }
  #crosshair::after  { width: 18px; height: 2px; left: -9px; top: -1px; }
  #crosshair.driving { opacity: 0; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; left: 18px; bottom: 14px; z-index: 10;
    color: #cfe3c0; font-size: 13px; line-height: 1.55;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
    pointer-events: none;
  }
  #hud .dim { color: #9aa98c; font-size: 11.5px; }

  /* ---------- Speed gauge (vehicle) ---------- */
  #gauge {
    position: fixed; right: 22px; bottom: 18px; z-index: 10;
    text-align: right; color: #e8dcc0; text-shadow: 0 1px 4px rgba(0,0,0,.9);
    pointer-events: none; display: none;
  }
  #gaugeSpeed { font-size: 42px; font-weight: 600; line-height: 1; }
  #gaugeSpeed small { font-size: 15px; color: #b7a97f; font-weight: 400; }
  #gaugeName { font-size: 13px; color: #b7a97f; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
  #gaugeGear { font-size: 12px; color: #9aa98c; margin-top: 2px; }

  /* ---------- Prompt (Press E) ---------- */
  #prompt {
    position: fixed; left: 50%; top: 62%; transform: translateX(-50%);
    z-index: 10; color: #fff; font-size: 16px;
    background: rgba(0,0,0,.55); padding: 10px 22px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,.25);
    display: none; pointer-events: none; letter-spacing: 1px;
  }
  #prompt b { color: #e8c96a; }

  /* ---------- Vehicle list ---------- */
  #vlist {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 8px; pointer-events: none;
  }
  .vchip {
    background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.15);
    border-radius: 20px; color: #aaa; padding: 5px 14px; font-size: 12px;
    letter-spacing: 1px; transition: all .25s;
  }
  .vchip.near { color: #ffd970; border-color: rgba(255,217,112,.5); }
  .vchip.active { color: #7fe07f; border-color: rgba(127,224,127,.6); }

  /* ---------- Minimap ---------- */
  #minimapWrap {
    position: fixed; right: 18px; top: 18px; z-index: 10;
    width: 170px; text-align: center;
  }
  #minimap { width: 170px; height: 170px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); display: block; }
  #mmLabel { color: #b7a97f; font-size: 11px; letter-spacing: 2px; margin-top: 5px; text-shadow: 0 1px 3px #000; }

  /* ---------- Pause ---------- */
  #pause {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.65);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #ddd; backdrop-filter: blur(4px);
  }
  #pause.hidden { display: none; }
  #pause h2 { font-size: 30px; letter-spacing: 4px; color: #c9b48a; margin-bottom: 20px; }
  #pause table { font-size: 14px; color: #bbb; border-spacing: 6px 4px; }
  #pause td.k { color: #e8c96a; text-align: right; padding-right: 14px; font-weight: 600; }
  #pause .resume { margin-top: 24px; color: #9aa98c; font-size: 13px; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="app"></div>

<div id="loader">
  <h1>DBH<span>-</span>WW1</h1>
  <p>WORLD WAR ONE TANK BATTLEFIELD</p>
  <div id="bar"><div id="barFill"></div></div>
  <div id="loadText">Загрузка...</div>
</div>

<div id="crosshair"></div>
<div id="prompt"></div>
<div id="hud"></div>
<div id="gauge">
  <div id="gaugeSpeed">0<small> км/ч</small></div>
  <div id="gaugeName"></div>
  <div id="gaugeGear"></div>
</div>
<div id="vlist"></div>
<div id="minimapWrap">
  <canvas id="minimap" width="170" height="170"></canvas>
  <div id="mmLabel">КАРТА</div>
</div>

<div id="pause" class="hidden">
  <h2>ПАУЗА</h2>
  <table>
    <tr><td class="k">W A S D</td><td>движение</td></tr>
    <tr><td class="k">SHIFT</td><td>бег</td></tr>
    <tr><td class="k">ПРОБЕЛ</td><td>прыжок / ручник</td></tr>
    <tr><td class="k">E</td><td>сесть в технику / выйти</td></tr>
    <tr><td class="k">МЫШЬ</td><td>осмотреться / камера танка</td></tr>
    <tr><td class="k">ESC</td><td>пауза</td></tr>
  </table>
  <div class="resume">нажми ESC чтобы продолжить</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="web/js/main.js"></script>
</body>
</html
